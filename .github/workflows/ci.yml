name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/enterprise-platform-*"

jobs:
  security-regressions:
    name: Security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "16777216"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check gateway formatting
        working-directory: backend
        run: cargo fmt --check

      - name: Test frontend state and project context
        run: pnpm test:frontend

      - name: Check frontend and API contract
        run: |
          pnpm check
          pnpm verify:api-parity

      - name: Test gateway data backup and restore
        run: |
          pnpm test:gateway-start-lock
          pnpm test:gateway-data

      - name: Test viewer route authorization
        working-directory: backend
        run: cargo test main_tests::auth_git_static::viewer_http_routes_match_websocket_authorization_policy

      - name: Test gateway health endpoints
        working-directory: backend
        run: cargo test main_tests::auth_git_static::health_readiness_and_metrics_endpoints_report_gateway_state

      - name: Test notification webhook pinning
        working-directory: backend
        run: cargo test main_tests::settings_and_automation::notification_webhook_resolution_skips_dns_pinning_for_literal_public_ip

      - name: Test forced shutdown confirmation
        working-directory: backend
        run: cargo test main_tests::settings_and_automation::forced_shutdown_requires_explicit_confirmation_phrase

      - name: Test state snapshot recovery
        working-directory: backend
        run: cargo test main_tests::settings_and_automation::corrupt_ui_state_recovers_from_previous_snapshot

      - name: Test attachment retention
        working-directory: backend
        run: cargo test main_tests::attachments_and_recovery::attachment_cleanup_retains_recent_orphans_until_min_age

      - name: Test Unix project execution and evidence paths
        working-directory: backend
        run: |
          cargo test project_lifecycle_execution
          cargo test project_validation_execution
          cargo test project_operation_command_support

      - name: Test tunnel safety
        run: pnpm verify:tunnel-safety

  windows-e2e:
    name: Windows E2E
    runs-on: windows-latest
    timeout-minutes: 70

    env:
      CODEX_WEBUI_E2E_PORT: "44173"
      CODEX_WEBUI_E2E_BASE_PATH: "/e2e/base"
      CODEX_WEBUI_E2E_PASSWORD: "test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin reproducible build metadata
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $timestamp = (git show -s --format=%cI HEAD).Trim()
          $epochMs = [DateTimeOffset]::Parse($timestamp).ToUnixTimeMilliseconds()
          "CODEX_WEBUI_BUILD_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CODEX_WEBUI_BUILD_EPOCH_MS=$epochMs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CODEX_WEBUI_BUILD_TIMESTAMP=$timestamp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Test project lifecycle and gateway release controls
        run: |
          cargo test --manifest-path backend/Cargo.toml project_registry_support
          cargo test --manifest-path backend/Cargo.toml project_manifest
          cargo test --manifest-path backend/Cargo.toml project_lifecycle_support
          cargo test --manifest-path backend/Cargo.toml project_lifecycle_migration_support
          cargo test --manifest-path backend/Cargo.toml project_lifecycle_execution
          cargo test --manifest-path backend/Cargo.toml project_validation_execution
          cargo test --manifest-path backend/Cargo.toml project_artifact_support
          cargo test --manifest-path backend/Cargo.toml project_operation_command_support
          pnpm test:gateway-start-lock
          pnpm test:gateway-release
          pnpm test:gateway-data

      - name: Build app
        run: pnpm build

      - name: Build fake Codex app-server
        run: pnpm build:e2e-fake

      - name: Run session workspace E2E
        run: pnpm exec playwright test e2e/computer-input.spec.ts e2e/continuous-session.spec.ts --reporter=line --workers=1

      - name: Run Project Registry E2E
        run: pnpm exec playwright test e2e/project-platform.spec.ts --reporter=line --workers=1
